name: Deploy to Dev

on:
  push:
    branches:
      - main          # fires when dev is merged into main

concurrency:
  group: deploy-dev
  cancel-in-progress: true   # cancel any in-flight deploy if a new push arrives

jobs:
  deploy:
    name: FTPS Deploy → Hostinger Dev
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Install lftp
        run: sudo apt-get install -y lftp

      - name: Deploy via FTP
        env:
          FTP_HOST: ${{ secrets.DEV_FTP_HOST }}
          FTP_USER: ${{ secrets.DEV_FTP_USER }}
          FTP_PASS: ${{ secrets.DEV_FTP_PASS }}
          FTP_PATH: ${{ secrets.DEV_FTP_PATH }}
        run: |
          lftp -u "$FTP_USER,$FTP_PASS" "ftp://$FTP_HOST" -e "
            set ftp:ssl-allow no;
            set net:timeout 30;
            set net:max-retries 3;
            mirror --reverse --delete --verbose \
              --exclude-glob .git \
              --exclude-glob .github \
              --exclude-glob .DS_Store \
              --exclude-glob .env \
              --exclude-glob node_modules \
              --exclude-glob vendor \
              ./ $FTP_PATH;
            bye
          "

      - name: Notify on success
        if: success()
        run: echo "✅ Axiom deployed to dev — $(date -u '+%Y-%m-%d %H:%M UTC')"

      - name: Notify on failure
        if: failure()
        run: echo "❌ Deploy failed — check FTP secrets in repo Settings → Secrets."
