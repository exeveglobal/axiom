name: Deploy to Dev

on:
  push:
    branches:
      - main          # fires when dev is merged into main

concurrency:
  group: deploy-dev
  cancel-in-progress: true   # cancel any in-flight deploy if a new push arrives

jobs:
  deploy:
    name: FTPS Deploy → Hostinger Dev
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history so the action can diff against the previous deploy

      - name: Deploy via FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server:      ${{ secrets.DEV_FTP_HOST }}
          username:    ${{ secrets.DEV_FTP_USER }}
          password:    ${{ secrets.DEV_FTP_PASS }}
          port:        21
          server-dir:  ${{ secrets.DEV_FTP_PATH }}
          # ^ e.g. /public_html/wp-content/themes/axiom/
          # Make sure the trailing slash is present.
          local-dir:   ./
          protocol:    ftp
          # Hostinger shared hosting does not support FTPS explicit TLS on port 21.
          state-name:  .ftp-deploy-sync-state.json
          # Tracks which files were last uploaded so only changed files are
          # re-uploaded on subsequent deploys (not a full sync every time).
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/node_modules/**
            **/.DS_Store
            **/.env*
            **/vendor/**
            .ftp-deploy-sync-state.json

      - name: Notify on success
        if: success()
        run: echo "✅ Axiom deployed to dev — $(date -u '+%Y-%m-%d %H:%M UTC')"

      - name: Notify on failure
        if: failure()
        run: echo "❌ Deploy failed — check FTP secrets and server-dir path in repo Settings → Secrets."
