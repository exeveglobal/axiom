name: Deploy to Dev

on:
  push:
    branches:
      - main

concurrency:
  group: deploy-dev
  cancel-in-progress: true

jobs:
  deploy:
    name: FTP Deploy → Hostinger Dev
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        # depth 2 gives us HEAD and HEAD~1 so we can diff what changed
        run: git clone --depth 2 --branch main "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" .

      - name: Install lftp
        run: sudo apt-get install -y lftp

      - name: Deploy via FTP
        env:
          FTP_HOST: ${{ secrets.DEV_FTP_HOST }}
          FTP_USER: ${{ secrets.DEV_FTP_USER }}
          FTP_PASS: ${{ secrets.DEV_FTP_PASS }}
          FTP_PATH: ${{ secrets.DEV_FTP_PATH }}
        run: |
          set -e

          FTP_HEADER="set ftp:ssl-allow no
          set ftp:passive-mode yes
          set net:timeout 30
          set net:max-retries 3
          set net:reconnect-interval-base 5
          set net:reconnect-interval-multiplier 1"

          # ── Initial deploy: no parent commit exists ───────────────────────────
          if ! git rev-parse HEAD~1 >/dev/null 2>&1; then
            echo "Initial deploy — uploading all files via mirror."
            SCRIPT=$(mktemp)
            printf '%s\n' "$FTP_HEADER" > "$SCRIPT"
            printf 'mirror --reverse --delete --verbose --exclude "^\\." ./ %s\n' "$FTP_PATH" >> "$SCRIPT"
            printf 'bye\n' >> "$SCRIPT"
            lftp -u "$FTP_USER,$FTP_PASS" "ftp://$FTP_HOST" < "$SCRIPT"
            rm -f "$SCRIPT"
            exit 0
          fi

          # ── Incremental deploy ────────────────────────────────────────────────
          # Files to upload: added (A), copied (C), modified (M), renamed new path (R→col3)
          UPLOAD=$(git diff --name-status --diff-filter=ACMR HEAD~1 HEAD \
            | awk '/^[ACM]/{print $2} /^R/{print $3}' \
            | grep -Ev '^(\.git|\.github|\.gitignore|\.DS_Store|docs)' || true)

          # Files to remove: deleted (D), renamed old path (R→col2)
          DELETE=$(git diff --name-status --diff-filter=DR HEAD~1 HEAD \
            | awk '/^D/{print $2} /^R/{print $2}' \
            | grep -Ev '^(\.git|\.github|\.gitignore|\.DS_Store|docs)' || true)

          if [ -z "$UPLOAD" ] && [ -z "$DELETE" ]; then
            echo "No deployable file changes — skipping FTP."
            exit 0
          fi

          # Build an lftp script file (avoids argument-length limits and quoting issues)
          SCRIPT=$(mktemp)
          printf '%s\n' "$FTP_HEADER" > "$SCRIPT"

          while IFS= read -r file; do
            [ -z "$file" ] && continue
            dir=$(dirname "$file")
            # Create the remote directory tree if the file is nested
            if [ "$dir" != "." ]; then
              printf 'mkdir -p "%s/%s"\n' "$FTP_PATH" "$dir" >> "$SCRIPT"
            fi
            printf 'put "%s" -o "%s/%s"\n' "$file" "$FTP_PATH" "$file" >> "$SCRIPT"
          done <<< "$UPLOAD"

          while IFS= read -r file; do
            [ -z "$file" ] && continue
            printf 'rm -f "%s/%s"\n' "$FTP_PATH" "$file" >> "$SCRIPT"
          done <<< "$DELETE"

          printf 'bye\n' >> "$SCRIPT"

          echo "=== FTP deploy plan ==="
          cat "$SCRIPT"
          echo "======================="

          lftp -u "$FTP_USER,$FTP_PASS" "ftp://$FTP_HOST" < "$SCRIPT"
          rm -f "$SCRIPT"

      - name: Notify on success
        if: success()
        run: echo "✅ Axiom deployed to dev — $(date -u '+%Y-%m-%d %H:%M UTC')"

      - name: Notify on failure
        if: failure()
        run: echo "❌ Deploy failed — check FTP secrets in repo Settings → Secrets."
